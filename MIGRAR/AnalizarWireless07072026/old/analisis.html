<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla de Clientes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">

    <style>
        /* Definición de variables CSS para los temas */
        :root {
            /* Variables por defecto (Tema Oscuro) */
            --primary-bg: #0a0a0f;
            --secondary-bg: #1a1a2e;
            --accent-bg: #16213e;
            --card-bg: #1e1e3f;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent-color: #00d4ff;
            --success-color: #00ff88;
            --warning-color: #ffb800;
            --danger-color: #ff4757;
            --orange-color: #ff8c00;
            --border-color: #333366;
            --button-text-color: var(--primary-bg);
            transition:
                --primary-bg 0.5s ease-in-out,
                --secondary-bg 0.5s ease-in-out,
                --accent-bg 0.5s ease-in-out,
                --card-bg 0.5s ease-in-out,
                --text-primary 0.5s ease-in-out,
                --text-secondary 0.5s ease-in-out,
                --accent-color 0.5s ease-in-out,
                --success-color 0.5s ease-in-out,
                --warning-color 0.5s ease-in-out,
                --danger-color 0.5s ease-in-out,
                --orange-color 0.5s ease-in-out,
                --border-color 0.5s ease-in-out,
                --button-text-color 0.5s ease-in-out;
        }

        /* Tema Blanco */
        body.light-mode {
            --primary-bg: #ffffff;
            --secondary-bg: #f0f2f5;
            --accent-bg: #e0e2e5;
            --card-bg: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --accent-color: #007bff;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --orange-color: #fd7e14;
            --border-color: #cccccc;
            --button-text-color: #ffffff;
        }

        /* Tema Gris */
        body.gray-mode {
            --primary-bg: #e0e0e0;
            --secondary-bg: #cccccc;
            --accent-bg: #bbbbbb;
            --card-bg: #e0e0e0;
            --text-primary: #333333;
            --text-secondary: #555555;
            --accent-color: #6c757d;
            --success-color: #20c997;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --orange-color: #fd7e14;
            --border-color: #999999;
            --button-text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, var(--primary-bg) 0%, var(--secondary-bg) 100%);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .table-container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .table-container h3 {
            font-size: 1.3em;
            color: var(--text-primary);
            margin-bottom: 20px;
            text-align: center;
        }

        table.dataTable {
            width: 100% !important;
            background-color: transparent;
            border-collapse: collapse;
        }

        table.dataTable thead {
            background: var(--accent-bg);
        }

        table.dataTable thead th {
            padding: 15px 12px;
            border-bottom: 2px solid var(--accent-color);
            color: var(--text-primary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 0.5px;
        }

        table.dataTable tbody td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            transition: background-color 0.5s ease-in-out;
        }

        table.dataTable tbody td.color-green { background-color: var(--success-color); color: #000; }
        table.dataTable tbody td.color-yellow { background-color: var(--warning-color); color: #000; }
        table.dataTable tbody td.color-orange { background-color: var(--orange-color); color: #000; }
        table.dataTable tbody td.color-red { background-color: var(--danger-color); color: #fff; }

        table.dataTable tbody tr:hover {
            background-color: var(--accent-bg);
            transform: scale(1.01);
            transition: all 0.3s ease;
        }

        .dataTables_wrapper .dataTables_filter input {
            background: var(--accent-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9em;
        }

        .dataTables_wrapper .dataTables_filter input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.2);
        }

        .dataTables_wrapper .dataTables_length select {
            background: var(--accent-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 5px 10px;
            border-radius: 8px;
        }

        .dataTables_wrapper .dataTables_info,
        .dataTables_wrapper .dataTables_paginate {
            color: var(--text-secondary);
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button {
            background: var(--accent-bg) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-primary) !important;
            border-radius: 5px !important;
            margin: 0 2px !important;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button:hover {
            background: var(--accent-color) !important;
            color: var(--button-text-color) !important;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-online { background-color: var(--success-color); }
        .status-warning { background-color: var(--warning-color); }
        .status-offline { background-color: var(--danger-color); }

        .usage-bar {
            width: 100px;
            height: 8px;
            background: var(--accent-bg);
            border-radius: 4px;
            overflow: hidden;
            display: inline-block;
            margin-right: 10px;
        }

        .usage-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success-color), var(--warning-color), var(--danger-color));
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="table-container">
        <h3>Tabla Detallada de Clientes (Ultima hora)</h3>
        <table id="tablaClientes" class="display nowrap" cellspacing="0">
            <thead>
                <tr>
                    <th>Estado</th>
                    <th>Cliente</th>
                    <th>Hostname</th>
                    <th>IP</th>
                    <th>MAC</th>
                    <th>OS</th>
                    <th>AP</th>
                    <th>SNR</th>
                    <th>Throughput Rx</th>
                    <th>Throughput Tx</th>
                    <th>Última Actualización</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>

    <script>
        let datosClientes = [];
        let tabla;

        const throughputThresholds = {
            red: 40,
            orange: 25,
            yellow: 10,
        };

        function getThroughputColorClass(mbps) {
            if (mbps >= throughputThresholds.red) return 'color-red';
            if (mbps >= throughputThresholds.orange) return 'color-orange';
            if (mbps >= throughputThresholds.yellow) return 'color-yellow';
            return 'color-green';
        }

        function formatBps(bps, decimals = 2) {
            if (bps === 0 || isNaN(bps)) return '0 bps';
            const k = 1000;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['bps', 'Kbps', 'Mbps', 'Gbps', 'Tbps'];
            const i = Math.floor(Math.log(bps) / Math.log(k));
            return parseFloat((bps / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        function determinarEstado(snr, lastdate) {
            const now = new Date();
            const lastUpdate = new Date(lastdate);
            const diffMinutes = (now - lastUpdate) / (1000 * 60);
            if (diffMinutes > 30) return 'offline';
            if (parseFloat(snr) < 20) return 'warning';
            return 'online';
        }

        function cargarDatos() {
            $.ajax({
                url: 'obtener_datos.php',
                type: 'GET',
                dataType: 'json',
                success: function(response) {
                    datosClientes = response.data || [];
                    if ($.fn.DataTable.isDataTable('#tablaClientes')) {
                        tabla.destroy();
                        $('#tablaClientes tbody').empty();
                    }

                    tabla = $('#tablaClientes').DataTable({
                        responsive: true,
                        scrollX: true,
                        pageLength: 25,
                        order: [[7, 'desc']],
                        language: {
                            url: 'js/Spanish.json'
                        },
                        columnDefs: [
                            { targets: [0], searchable: false },
                            {
                                targets: [8, 9],
                                type: 'html-num-fmt',
                                createdCell: function (td, cellData, rowData, row, col) {
                                    const throughputValue = (col === 8) ? (parseFloat(rowData.rx_throughput) || 0) : (parseFloat(rowData.tx_throughput) || 0);
                                    const throughputMbps = throughputValue / 1000000;
                                    $(td).addClass(getThroughputColorClass(throughputMbps));
                                },
                                render: function(data, type, row) {
                                    if (type === 'display' || type === 'type') {
                                        var valueMatch = data.match(/data-order="([^"]+)"/);
                                        const actualValue = valueMatch ? parseFloat(valueMatch[1]) : 0;
                                        const throughputMbps = actualValue / 1000000;
                                        const usagePercent = Math.min((throughputMbps / throughputThresholds.red) * 100, 100);
                                        
                                        return `<span data-order="${actualValue}"><div class="usage-bar"><div class="usage-fill" style="width: ${usagePercent}%"></div></div>${formatBps(actualValue)}</span>`;
                                    }
                                    var match = data.match(/data-order="([^"]+)"/);
                                    return match ? parseFloat(match[1]) : 0;
                                }
                            }
                        ],
                        data: datosClientes.map(cliente => {
                            const estado = determinarEstado(cliente.snr, cliente.lastdate);
                            const rxThroughput = parseFloat(cliente.rx_throughput) || 0;
                            const txThroughput = parseFloat(cliente.tx_throughput) || 0;

                            return [
                                `<span class="status-indicator status-${estado}"></span>`,
                                cliente.nombre || 'Sin nombre',
                                cliente.nombre_equipo || 'Sin nombre',
                                cliente.ip_cliente,
                                cliente.mac,
                                cliente.os || 'Desconocido',
                                cliente.ip_ap,
                                cliente.snr + ' dB',
                                `<span data-order="${rxThroughput}">${formatBps(rxThroughput)}</span>`,
                                `<span data-order="${txThroughput}">${formatBps(txThroughput)}</span>`,
                                cliente.lastdate
                            ];
                        })
                    });
                },
                error: function(xhr, status, error) {
                    console.error('Error al cargar datos:', error);
                }
            });
        }

        $(document).ready(function() {
            tabla = $('#tablaClientes').DataTable({
                responsive: true,
                scrollX: true,
                pageLength: 25,
                order: [[7, 'desc']],
                language: {
                    url: 'js/Spanish.json'
                },
                columnDefs: [
                    { targets: [0], searchable: false },
                    {
                        targets: [8, 9],
                        type: 'html-num-fmt',
                        createdCell: function (td, cellData, rowData, row, col) {
                            const throughputValue = (col === 8) ? (parseFloat(rowData.rx_throughput) || 0) : (parseFloat(rowData.tx_throughput) || 0);
                            const throughputMbps = throughputValue / 1000000;
                            $(td).addClass(getThroughputColorClass(throughputMbps));
                        },
                        render: function(data, type, row) {
                            if (type === 'display' || type === 'type') {
                                var valueMatch = data.match(/data-order="([^"]+)"/);
                                const actualValue = valueMatch ? parseFloat(valueMatch[1]) : 0;
                                const throughputMbps = actualValue / 1000000;
                                const usagePercent = Math.min((throughputMbps / throughputThresholds.red) * 100, 100);
                                return `<span data-order="${actualValue}"><div class="usage-bar"><div class="usage-fill" style="width: ${usagePercent}%"></div></div>${formatBps(actualValue)}</span>`;
                            }
                            var match = data.match(/data-order="([^"]+)"/);
                            return match ? parseFloat(match[1]) : 0;
                        }
                    }
                ],
                data: []
            });
            cargarDatos();
            setInterval(cargarDatos, 30000);
        });
    </script>
</body>
</html>
